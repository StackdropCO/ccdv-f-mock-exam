name: Question correction
description: Report a question that looks wrong, outdated, or unclear.
labels: ["content"]

body:
  - type: input
    id: question
    attributes:
      label: Question
      placeholder: e.g. AI-042 or a few words from the question

  - type: textarea
    id: details
    attributes:
      label: What should be corrected?
      description: Explain the issue and what you think should change.
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source
      description: Link to documentation that supports the correction, if available.
