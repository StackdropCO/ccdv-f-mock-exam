name: Bug report
description: Report something that isn't working.
labels: ["bug"]

body:
  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: Tell us what you saw and, if possible, how to reproduce it.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser / device
      placeholder: Chrome on macOS, Safari on iPhone, etc.
